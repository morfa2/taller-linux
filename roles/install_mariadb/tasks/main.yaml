---
- name: Install mariadb server
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
        
- name: Bind mariadb to any interface
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: Restart mariadb server
 
- name: Mariadb started and enabled
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true
  
- name: Allow connections to database in UFW
  community.general.ufw:
    port: 3306
    proto: tcp
    rule: allow

- name: Check if root password exists
  ansible.mysql.mysql_user:
    login_user: root
    login_password: ""
    login_unix_socket: /var/run/mysqld/mysqld.sock
    check_implicit_admin: true
    name: root
    host: localhost
  register: mysql_root_check
  ignore_errors: true

- name: Debug password status
  ansible.builtin.debug:
    msg: "La password de root no esta inicializada"
  when: mysql_root_check.failed is false

- name: Initialize root password if not set
  ansible.mysql.mysql_user:
    login_user: root
    login_password: ""
    login_unix_socket: /var/run/mysqld/mysqld.sock
    check_implicit_admin: true
    name: root
    host: "{{ item }}"
    password: "{{ DB_ROOT_PW }}"
    state: present
  loop:
    - 127.0.0.1
    - localhost
  when: mysql_root_check.failed is false
